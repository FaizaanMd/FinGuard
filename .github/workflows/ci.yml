name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests (database-free)
        run: python -m pytest --cov=src --cov-report=term-missing
      - name: Verify runbook decodes (validation + cleaning + features)
        run: python scripts/smoke_no_db.py